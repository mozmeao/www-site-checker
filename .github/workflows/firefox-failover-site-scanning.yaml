name: "www.firefox.com failover page scanning"
on:
  workflow_dispatch:
  schedule:
    - cron: "5 5 * * *" # 05:05 UTC every day

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  SENTRY_DSN: https://45ad5d426da7480081831c053ca02cac@o1069899.ingest.sentry.io/6249535
  SLACK_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK_URL }}
  MEAO_IDENTITY_EMAIL: ${{ secrets.MEAO_IDENTITY_EMAIL }}
  FXC_FAILOVER_HOSTNAME: ${{ secrets.FXC_FAILOVER_HOSTNAME }}
  ALLOWLIST_FILEPATH: data/allowlist-firefox-failover.yaml
  USER_AGENT: Mozilla/5.0 (Automated; https://github.com/mozmeao/www-site-checker) CheckerBot/1.0

jobs:
  run_scan:
    runs-on: ubuntu-latest
    name: Check failover page
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run checker
        run: >
          python bin/scan_site.py
          --specific-url="https://$FXC_FAILOVER_HOSTNAME/"
          --export-cache
          --cache-all-pages
      - name: Upload scan output files
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: scan-results-firefox-failover
          path: output
          retention-days: 15
      - name: Upload page-cache
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: html-cache-firefox-failover
          path: page_cache
          retention-days: 5

  alert_if_report_files_exist:
    name: Alert if report files exist
    runs-on: ubuntu-latest
    needs:
      - run_scan
    permissions:
      contents: write # needed to push allowlist update branches
      pull-requests: write # needed to open allowlist update PRs
      issues: write # needed to file scan result issues
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Download all artifacts, if they exist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: output
          merge-multiple: true
      - name: Authenticate git for pushes
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Handle the scan results
        run: python bin/handle_site_scan_output.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
